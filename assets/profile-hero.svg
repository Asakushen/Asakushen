<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Asakushen — 把折腾，做成好用的东西</title>
  <desc id="desc">一个有青绿、紫色与橙色光晕的动态个人主页横幅。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a1a"/><stop offset=".5" stop-color="#14231f"/><stop offset="1" stop-color="#1d1831"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7de3c3"/><stop offset=".42" stop-color="#8b93ff"/><stop offset=".75" stop-color="#f1a86d"/><stop offset="1" stop-color="#f4d58d"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ecfff5" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>
  <g filter="url(#blur)" opacity=".78"><circle cx="1040" cy="78" r="130" fill="#7c77ff"><animate attributeName="cx" values="1040;1000;1040" dur="12s" repeatCount="indefinite"/></circle><circle cx="920" cy="330" r="125" fill="#e48658"><animate attributeName="cy" values="330;290;330" dur="10s" repeatCount="indefinite"/></circle><circle cx="530" cy="410" r="125" fill="#4cc69d" opacity=".65"><animate attributeName="cx" values="530;600;530" dur="15s" repeatCount="indefinite"/></circle></g>
  <path d="M-20 335 C155 242 292 420 490 329 S804 228 1225 318" fill="none" stroke="url(#ribbon)" stroke-width="4" opacity=".9"><animate attributeName="d" values="M-20 335 C155 242 292 420 490 329 S804 228 1225 318;M-20 350 C155 270 292 390 490 346 S804 198 1225 330;M-20 335 C155 242 292 420 490 329 S804 228 1225 318" dur="11s" repeatCount="indefinite"/></path>
  <path d="M-20 352 C155 259 292 437 490 346 S804 245 1225 335" fill="none" stroke="#f8fff9" stroke-width="1" opacity=".28"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="70" y="92" fill="#a9f0d0" font-size="15" font-weight="700" letter-spacing="4">ASAKUSHEN / MAKING THINGS ALIVE</text><text x="67" y="183" fill="#fbfffc" font-size="76" font-weight="750" letter-spacing="-2">Asakushen</text><text x="72" y="231" fill="#d0ded4" font-size="27">把折腾，做成好用的东西。</text><text x="72" y="268" fill="#9fb4a7" font-size="17">独立开发 · 自托管 · 云与边缘 · 系统魔改</text></g>
  <g transform="translate(72 302)"><rect width="139" height="36" rx="18" fill="url(#chip)" stroke="#a9f0d0" stroke-opacity=".48"/><circle cx="21" cy="18" r="5" fill="#80edb8"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle><text x="36" y="23" fill="#eafff2" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="600">持续构建中</text></g>
  <g transform="translate(960 82)"><rect width="152" height="50" rx="14" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".24"/><text x="18" y="22" fill="#c8d8ff" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5">STATUS</text><text x="18" y="40" fill="#ffffff" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="650">想法正在发光</text></g>
  <g fill="#fff"><circle cx="867" cy="128" r="3" opacity=".7"><animate attributeName="opacity" values=".1;1;.1" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="1135" cy="206" r="2" opacity=".6"><animate attributeName="opacity" values="1;.1;1" dur="4.7s" repeatCount="indefinite"/></circle><circle cx="820" cy="265" r="2.5" opacity=".5"><animate attributeName="opacity" values=".2;.9;.2" dur="5.4s" repeatCount="indefinite"/></circle></g>
</svg>
